[project]
name = "hunger-games-agent-backend"
version = "1.0.0"
description = "FastAPI + LangGraph RAG agent about The Hunger Games saga"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "pgvector==0.3.6",
    "python-multipart==0.0.20",
    "pyjwt[crypto]==2.10.1",
    "httpx==0.28.1",
    "langchain-core==0.3.28",
    "langchain-text-splitters==0.3.4",
    "langchain-ollama==0.2.2",
    "langgraph==0.2.60",
    "sentence-transformers==3.3.1",
    "torch==2.5.1",
    "pymupdf==1.25.1",
    "python-docx==1.1.2",
    "beautifulsoup4==4.12.3",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[tool.uv]
# Only resolve for the platforms we actually use (Docker/EC2 Linux, Windows and Apple Silicon laptops).
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# CPU-only PyTorch: the default PyPI wheel for Linux ships CUDA (~2.5 GB more).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
